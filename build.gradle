buildscript {
    ext.kotlin_version = '2.3.21'
    ext.google_play_services_version = '4.4.4'
    ext.firebase_crashlytics_version = '3.0.6'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.gms:google-services:$google_play_services_version"
        classpath "com.google.firebase:firebase-crashlytics-gradle:$firebase_crashlytics_version"
    }
}

apply from: 'buildsystem/dependencies.gradle'

// Versioning convention from ribot:
// Major -> Millions, Minor -> Thousands, Bugfix -> Hundreds. E.g 1.3.72 == 1,003,072
// Current: 1.0.9 (001,000,009)
def versionMajor = 1
def versionMinor = 0
def versionPatch = 9

allprojects {
    ext {
        compileSdkVersion = 36
        minSdkVersion = 23
        targetSdkVersion = 36
        androidApplicationId = "com.sedsoftware.yaptalker"
        androidVersionCode = versionMajor * 1000000 + versionMinor * 1000 + versionPatch
        androidVersionName = "${versionMajor}.${versionMinor}.${versionPatch}"
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
        testApplicationId = "com.sedsoftware.yaptalker.test"
    }
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://artifactory.appodeal.com/appodeal-public/" }
        maven { url "https://repository.liferay.com/nexus/content/groups/public/" }
        gradlePluginPortal()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
